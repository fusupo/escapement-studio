name: CI

on:
  pull_request:
    branches: [develop]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - run: npm ci
      - run: npm run check
      - run: npm run check:web
      - run: npm test
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
